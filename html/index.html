<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Configuração</title>
    <style>
        /* CSS Simples para centralizar e dar um visual limpo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #2ecc71; /* Barra verde de sucesso */
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        p {
            color: #7f8c8d;
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>A configuração deu certo</h1>
        <p>O ambiente está pronto e respondendo corretamente.</p>
    </div>

</body>
</html>
