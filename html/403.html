<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 403 - Acesso Negado</title>
    <style>
        /* CSS Simples para centralizar e dar um visual de alerta */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fceae8; /* Fundo levemente avermelhado */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #e74c3c; /* Barra vermelha de erro */
            text-align: center;
            max-width: 400px;
        }

        .error-code {
            font-size: 54px;
            font-weight: bold;
            color: #e74c3c;
            margin: 0 0 10px 0;
            line-height: 1;
        }

        h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        p {
            color: #7f8c8d;
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="error-code">403</div>
        <h1>Acesso Proibido</h1>
        <p>Você não tem permissão para acessar este recurso ou diretório neste servidor.</p>
    </div>

</body>
</html>
